# set true color
# set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on

#set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

#supposedly be able to Shift Alt H/L to switch windows
bind -n M-H previous-window
bind -n M-L next-window

#start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# When a new session is created, rename its first window
set-hook -g after-new-session 'rename-window -t 1 neovim'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
# set -g @plugin 'catppuccin/tmux'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'

#open panes in current directory UNUSED
# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"

# vi key movement for copy/paste in terminal
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel `xclip -in -selection clipboard`

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

unbind-key w
bind-key w display-popup -E "zsh -i -c 'tmux-sessionizer'"

run '~/.tmux/plugins/tpm/tpm'
